services:
  postgres-dev:
    profiles: [dev]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: treefime
      POSTGRES_USER: treefime
      POSTGRES_PASSWORD: treefime-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treefime -d treefime"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-dev:
    profiles: [dev]
    build:
      context: ./backend
      target: development
    command: cargo run --bin treefime-api
    environment:
      DATABASE_URL: postgres://treefime:treefime-dev-only@postgres-dev:5432/treefime
      PORT: 8080
      AUTO_MIGRATE: "true"
      COOKIE_SECURE: "false"
    volumes:
      - ./backend:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    ports:
      - "8080:8080"
    depends_on:
      postgres-dev:
        condition: service_healthy

  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      target: development
    command: npm run dev
    environment:
      API_INTERNAL_URL: http://backend-dev:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"

  migrate-dev:
    profiles: [dev]
    build:
      context: ./backend
      target: production
    entrypoint: ["treefime-migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://treefime:treefime-dev-only@postgres-dev:5432/treefime
    depends_on:
      postgres-dev:
        condition: service_healthy

  postgres-prod:
    profiles: [prod]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-treefime}
      POSTGRES_USER: ${POSTGRES_USER:-treefime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate-prod:
    profiles: [prod]
    build:
      context: ./backend
      target: production
    entrypoint: ["treefime-migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-treefime}:${POSTGRES_PASSWORD:-}@postgres-prod:5432/${POSTGRES_DB:-treefime}
    depends_on:
      postgres-prod:
        condition: service_healthy

  backend-prod:
    profiles: [prod]
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-treefime}:${POSTGRES_PASSWORD:-}@postgres-prod:5432/${POSTGRES_DB:-treefime}
      PORT: 8080
      AUTO_MIGRATE: "false"
      COOKIE_SECURE: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres-prod:
        condition: service_healthy
      migrate-prod:
        condition: service_completed_successfully

  frontend-prod:
    profiles: [prod]
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend-prod:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend-prod

volumes:
  postgres_dev_data:
  postgres_prod_data:
  cargo_registry:
  cargo_git:
  cargo_target:
  frontend_node_modules:
  frontend_next_cache:
